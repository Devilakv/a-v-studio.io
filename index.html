<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Under Development — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a14;
    --card:rgba(255,255,255,.04);
    --border:rgba(255,255,255,.09);
    --text:#f2f3f7;
    --muted:#9aa0b5;
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --glow:rgba(124,92,255,.55);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* animated background orbs */
  .bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 18s ease-in-out infinite}
  .orb.one{width:480px;height:480px;background:#7c5cff;top:-140px;left:-120px}
  .orb.two{width:420px;height:420px;background:#22d3ee;bottom:-160px;right:-100px;animation-delay:-6s}
  .orb.three{width:360px;height:360px;background:#ec4899;top:40%;left:55%;opacity:.28;animation-delay:-11s}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(60px,-40px) scale(1.08)}
    66%{transform:translate(-40px,50px) scale(.94)}
  }

  /* subtle grid overlay */
  .grid-overlay{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 40%,transparent 100%);
  }

  .wrap{position:relative;z-index:2;width:100%;max-width:760px;text-align:center}

  /* badge */
  .badge{
    display:inline-flex;align-items:center;gap:9px;
    padding:8px 16px;border-radius:999px;
    background:var(--card);border:1px solid var(--border);
    font-size:.82rem;font-weight:500;color:var(--muted);
    backdrop-filter:blur(12px);
    animation:fadeUp .8s ease both;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 0 0 rgba(34,211,238,.6);animation:pulse 2s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}
    70%{box-shadow:0 0 0 10px rgba(34,211,238,0)}
    100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(2.6rem,8vw,4.6rem);
    font-weight:700;
    line-height:1.05;
    letter-spacing:-.03em;
    margin:26px 0 0;
    animation:fadeUp .8s .1s ease both;
  }
  h1 .grad{
    background:linear-gradient(120deg,#a78bfa,#22d3ee 55%,#f0abfc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shine 6s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}

  .sub{
    margin:22px auto 0;max-width:520px;
    color:var(--muted);font-size:clamp(1rem,2.4vw,1.15rem);line-height:1.7;
    animation:fadeUp .8s .2s ease both;
  }

  /* progress bar */
  .progress-block{
    margin:40px auto 0;max-width:440px;text-align:left;
    animation:fadeUp .8s .3s ease both;
  }
  .progress-head{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:10px}
  .progress-head b{color:var(--text);font-weight:600}
  .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--border)}
  .bar span{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 16px var(--glow);
    animation:fill 2.2s .6s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes fill{to{width:72%}}

  /* countdown */
  .countdown{
    display:flex;justify-content:center;gap:14px;margin:44px 0 0;
    animation:fadeUp .8s .4s ease both;
  }
  .cd{
    min-width:86px;padding:16px 12px;border-radius:18px;
    background:var(--card);border:1px solid var(--border);backdrop-filter:blur(12px);
    transition:transform .3s ease,border-color .3s ease;
  }
  .cd:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.5)}
  .cd .num{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;line-height:1}
  .cd .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}

  /* CTA */
  .cta{margin-top:44px;animation:fadeUp .8s .5s ease both}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 30px;border-radius:999px;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:1rem;font-weight:600;color:#fff;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    box-shadow:0 10px 30px var(--glow);
    transition:transform .25s ease,box-shadow .25s ease;
    text-decoration:none;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px var(--glow)}
  .btn svg{transition:transform .25s ease}
  .btn:hover svg{transform:translateX(4px)}

  .foot{margin-top:56px;font-size:.82rem;color:var(--muted);animation:fadeUp .8s .6s ease both}
  .socials{display:flex;justify-content:center;gap:14px;margin-top:16px}
  .socials a{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    transition:all .25s ease;
  }
  .socials a:hover{color:#fff;border-color:rgba(124,92,255,.5);transform:translateY(-3px)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  @media(max-width:480px){
    .countdown{gap:8px}
    .cd{min-width:0;flex:1;padding:14px 6px}
    .cd .num{font-size:1.5rem}
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>
  <div class="grid-overlay"></div>

  <main class="wrap">
    <span class="badge"><span class="dot"></span> We're building something great</span>

    <h1>This website is<br><span class="grad">Under Development</span></h1>

    <p class="sub">
      Our team is crafting a brand-new experience just for you.
      Something exciting is on the way — stay tuned and check back soon!
    </p>

    <div class="progress-block">
      <div class="progress-head"><span>Building progress</span><b>42%</b></div>
      <div class="bar"><span></span></div>
    </div>

    <div class="countdown" id="countdown">
      <div class="cd"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
      <div class="cd"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
      <div class="cd"><div class="num" id="mins">00</div><div class="lbl">Minutes</div></div>
      <div class="cd"><div class="num" id="secs">00</div><div class="lbl">Seconds</div></div>
    </div>

    <div class="cta">
      <a href="mailto: anshuverma874382@gmail.com" class="btn">
        Get in touch
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>

    <div class="foot">
      © 2026 · All rights reserved
      <div class="socials">
        <a href="#" aria-label="Twitter"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.83L0 1.15h7.6l5.24 6.93 6.06-6.93Zm-1.29 19.5h2.04L6.48 3.24H4.3l13.31 17.41Z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
        <a href="#" aria-label="LinkedIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.55c0-1.32-.02-3.03-1.85-3.03-1.85 0-2.13 1.44-2.13 2.93V21h-4V9Z"/></svg></a>
      </div>
    </div>
  </main>

<script>
  // Countdown — set your launch date here
  const launchDate = new Date();
  launchDate.setDate(launchDate.getDate() + 30); // 30 days from now

  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  function tick(){
    const now = new Date();
    let diff = Math.max(0, launchDate - now);
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000);  diff -= h*3600000;
    const m = Math.floor(diff/60000);    diff -= m*60000;
    const s = Math.floor(diff/1000);
    el('days').textContent = pad(d);
    el('hours').textContent = pad(h);
    el('mins').textContent = pad(m);
    el('secs').textContent = pad(s);
  }
  tick();
  setInterval(tick,1000);
</script>
</body>
</html>
